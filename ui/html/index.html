{{define "title"}}Blog{{end}}
<!-- Main -->
{{define "main"}}
<article>
  <h1>Blogs</h1>
  <ul>
    {{range .Pages}}
    <li>
      <a href="/blog/{{.URL}}">{{.Title}}</a> -
      <time datetime="{{.Date}}">{{.Date}}</time>
      <span class="blog-category" data-type="{{.Category}}"></span>
      <span class="blog-category" data-type="JS"></span>
      <span class="blog-category" data-type="CSS"></span>
    </li>
    {{end}}
  </ul>
</article>
{{end}}
